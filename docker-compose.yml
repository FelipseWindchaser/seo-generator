 app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # ... env vars
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
    restart: unless-stopped
    command: npm run start # Запускает API сервер
    
worker: # <-- НОВЫЙ СЕРВИС
    build: .
    environment:
      # ... те же env vars
    depends_on:
      - redis
    restart: unless-stopped
    command: npm run worker # Запускает воркер

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - "6379:6379"

  # nginx:
